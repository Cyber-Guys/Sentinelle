worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  access_log off;
  sendfile on;
  # DNS di Docker risolto a ogni richiesta: il backend puo' essere ricreato senza riavviare nginx
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 80m; # foto e video dal telefono
    absolute_redirect off;

    # /api/** -> backend senza il prefisso; buffering spento per gli eventi SSE (/api/eventi) e i video (Range).
    # Solo le rotte che usa l'app cittadino: con il tunnel l'app e' pubblica e le azioni degli operatori
    # (conferma, archivia, stato, simulazione) non devono passare di qui.
    location ~ ^/api/((salute|eventi|luogo|cerca)|foto/[^/]+|(utenti|localita)(/[a-z0-9_/-]*)?|segnalazioni(/attive|/[0-9]+/voto)?)$ {
      set $backend http://backend:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 5m;
    }
    location /api/ {
      default_type text/plain;
      return 403 "Non disponibile da questa app.\n";
    }

    # file con hash nel nome
    location /_nuxt/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PMTiles: nginx risponde alle Range di MapLibre; gia' compressi, niente gzip (montati da frontend/public)
    location /tiles/ {
      add_header Cache-Control "public, max-age=3600";
    }

    # glifi non latini mancanti: pbf vuoto invece dell'HTML della SPA
    location ~ ^/basemap/fonts/.+\.pbf$ {
      try_files $uri @pbf_vuoto;
    }
    location @pbf_vuoto {
      default_type application/x-protobuf;
      add_header Cache-Control "public, max-age=86400";
      return 200;
    }

    # SPA: tutte le pagine ricadono sul fallback generato da Nuxt
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /200.html;
    }
  }
}
