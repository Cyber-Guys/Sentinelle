# Sviluppo con hot reload, sopra compose.yaml:  ./scripts/docker.sh dev
# Backend: uvicorn --reload sui sorgenti montati. Webapp: nuxt dev (porta 3000, ~600 MB di RAM: per solo
# guardare l'app usare lo stack normale, che pesa una frazione). Il cruscotto resta quello statico;
# per lavorarci: ./scripts/docker.sh dev-dashboard (compose.dev-dashboard.yaml).
# Aggiungere un file in cima a webapp/ (non dentro app/) richiede di montarlo qui.
services:
  backend:
    command: ["uvicorn", "sentinelle.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/backend/src", "--timeout-graceful-shutdown", "2"]
    volumes:
      - ./backend/src:/app/backend/src:ro
      - ./backend/config:/app/backend/config:ro
      - ./infra/schema.sql:/app/infra/schema.sql:ro
      - ./dati:/app/dati:ro
      - ./scripts:/app/scripts:ro
      - foto:/app/backend/foto

  webapp:
    build: !override
      context: ./webapp
      target: dev
    image: sentinelle-docker-webapp-dev
    environment:
      BACKEND_URL: http://backend:8000
    ports: !override
      - "${SENTINELLE_PORTA_APP:-3000}:3000"
    # node_modules e .nuxt restano nel container: niente file di root nel clone
    volumes: !override
      - ./webapp/app:/app/app
      - ./webapp/nuxt.config.ts:/app/nuxt.config.ts:ro
      - ./webapp/tsconfig.json:/app/tsconfig.json:ro
      - ./webapp/public/manifest.webmanifest:/app/public/manifest.webmanifest:ro
      - ./webapp/public/icona.svg:/app/public/icona.svg:ro
      - ./frontend/public/tiles:/app/public/tiles:ro
      - ./frontend/public/basemap:/app/public/basemap:ro
