worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  access_log off;
  sendfile on;
  # DNS di Docker risolto a ogni richiesta: il backend puo' essere ricreato senza riavviare nginx
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m; # foto dal telefono
    absolute_redirect off; # la porta interna (80) non e' quella pubblicata

    # /api/** -> backend senza il prefisso; buffering spento per gli eventi SSE (/api/eventi)
    location /api/ {
      set $backend http://backend:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    # file con hash nel nome
    location /_nuxt/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PMTiles: nginx risponde alle Range di MapLibre; gia' compressi, niente gzip
    location /tiles/ {
      add_header Cache-Control "public, max-age=3600";
    }

    # glifi non latini mancanti: pbf vuoto invece dell'HTML della SPA (come server/routes/basemap/fonts)
    location ~ ^/basemap/fonts/.+\.pbf$ {
      try_files $uri @pbf_vuoto;
    }
    location @pbf_vuoto {
      default_type application/x-protobuf;
      add_header Cache-Control "public, max-age=86400";
      return 200;
    }

    # SPA: /app e /cruscotto ricadono sul fallback generato da Nuxt
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /200.html;
    }
  }
}
