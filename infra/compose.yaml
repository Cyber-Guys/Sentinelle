# Progetto Docker fisso ("sentinelle"), indipendente dal nome della cartella del clone.
# Porta esterna configurabile: SENTINELLE_PORTA_DB=5433 se la 5432 e' occupata
# (in quel caso aggiornare anche DATABASE_URL in .env).
name: sentinelle
services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: sentinelle
      POSTGRES_PASSWORD: sentinelle
      POSTGRES_DB: sentinelle
    ports:
      - "${SENTINELLE_PORTA_DB:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sentinelle -d sentinelle"]
      interval: 2s
      timeout: 3s
      retries: 60
    volumes:
      - dati_db:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  dati_db:
